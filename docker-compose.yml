services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: universe-studio-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-universe_studio}
      POSTGRES_USER: ${POSTGRES_USER:-universe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-universe_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-universe} -d ${POSTGRES_DB:-universe_studio}"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: universe-studio-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/universe_dev_password}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./docker/neo4j/import:/var/lib/neo4j/import
      - ./docker/neo4j/plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-universe_dev_password} 'RETURN 1'"]
      interval: 15s
      timeout: 10s
      retries: 8

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: universe-studio-backend
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: universe-studio-frontend
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  frontend_node_modules:
