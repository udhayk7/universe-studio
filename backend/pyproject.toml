[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "universe-studio-backend"
version = "0.1.0"
description = "FastAPI foundation for Universe Studio."
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.13.0,<2.0.0",
  "fastapi[standard]>=0.115.0,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
  "neo4j>=5.25.0,<6.0.0",
  "openai>=1.0.0",
  "openai-agents>=0.3.0,<1.0.0",
  "pgvector>=0.3.0,<1.0.0",
  "psycopg[binary,pool]>=3.2.0,<4.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "pydantic-settings>=2.4.0,<3.0.0",
  "python-multipart>=0.0.12,<1.0.0",
  "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
  "structlog>=24.0.0,<26.0.0",
  "supabase>=2.10.0,<3.0.0",
  "tenacity>=9.0.0,<10.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13.0,<2.0.0",
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
  "ruff>=0.8.0,<1.0.0"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
